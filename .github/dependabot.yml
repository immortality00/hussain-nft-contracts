version: 2

updates:
  # SmartPy and its dependencies. A new SmartPy is read release note by
  # release note and tested before it is pinned; a deployed contract is
  # never recompiled with a different version (the README names the one used).
  - package-ecosystem: pip
    directory: /tezos
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Dubai
    open-pull-requests-limit: 2
    commit-message:
      prefix: fix(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Dubai
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci(deps)
