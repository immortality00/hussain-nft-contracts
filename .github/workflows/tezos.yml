name: tezos

on:
  push:
    branches: [main]
  pull_request:

# Nothing in this workflow writes to the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    # Above the sum of the step limits, so a stuck step fails first.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 2
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        timeout-minutes: 3
        with:
          python-version: "3.12"

      - name: Install SmartPy (pinned by hash)
        timeout-minutes: 5
        run: python -m pip install --require-hashes --only-binary :all: -r tezos/requirements.txt

      - name: Run the contract tests
        timeout-minutes: 10
        run: python tezos/run_tests.py
